<script>
    function GenerateInputFields(name, label, format) {
        let options = [];
        let html = [];
        return {
            // In: function(displayLabel, value) {
            //     options.push({ label: displayLabel, value: value });
            //     return this;
            // },
            Text: function(displayLabel){

            },
            Radio: function(displayLabel, value, first = false){
                options.push({ type: "radio", value: value });

                let checked = first ? "checked" : "";
                html.push(`<input type="radio" class="${name} form-control" name="${name}" value="${value}" ${checked}> 
                            <span>${displayLabel}</span><br>`);
                return this;
            },
            Build: function() {
                let outputHTML = `<div class="flex">
                    <div class="bg-grey padding-10 margin-1 roudned">
                        <label>${label}</label><br>`;
                
                html.forEach((option, index) => {
                    outputHTML += option;
                });
                
                // if (type === "radio" || type === "checkbox") {
                //     options.forEach((option, index) => {
                //         let checked = index === 0 ? "checked" : "";
                //         html += `<input type="${type}" class="${name} form-control" name="${name}" value="${option.value}" ${checked}> 
                //                 <span>${option.label}</span><br>`;
                //     });
                // } else {
                //     options.forEach((option, index) => {
                //         html += `<input type="${type}" class="${name} form-control" name="${name}">`;
                //     });
                // }
                
                outputHTML += `</div></div>`;

                let gatherFunction = function() {
                    let inputElements = document.querySelectorAll(`input[name='${name}']`);
                    var output = "";
                    options.forEach((option, index) => {
                        if (option.type === "radio") {
                            let selected = document.querySelector(`input[name='${name}']:checked`);
                            console.log(selected.value);
                            output += selected && selected.value !== "null" ? format.replace("[VALUE]", selected.value) : "";
                        } else if (option.type === "checkbox") {
                            let values = Array.from(inputElements)
                                .filter(el => el.checked)
                                .map(el => el.value !== "null" ? el.value : null)
                                .filter(val => val !== null);
                            output += values.length > 0 ? format.replace("[VALUE]", values.join(", ")) : "";
                        } else {
                            let inputValue = inputElements[0]?.value || "";
                            output += inputValue && inputValue !== "null" ? format.replace("[VALUE]", inputValue) : "";
                        }
                    });
                    return output;
                };
                
                return [outputHTML, gatherFunction];
            },
        };
    }

    function InsertHTML(targetName, htmlString) {
