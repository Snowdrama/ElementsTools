<html>
    <head>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <h2>Notes Generator</h2>
        <div id="client-info" name="client-form"></div>
        <h2>Massage Appointment Notes</h2>
        <div id="massage-notes" name="massage-form"></div>
        <h2>Skincare Appointment Notes</h2>
        <div id="skincare-notes" name="skincare-form"></div>

        <div>
            <div class="flex">
                <div class="bg-grey padding-10 margin-1 roudned">
                    <div>
                        <button onclick="OnSubmit()">Generate</button>
                        <button onclick="Clear()">Clear</button>
                    </div>
                    <textarea id="output-field" style="width: 100%; height: 200px;"></textarea>
                </div>
            </div>
        </div>
    </body>
</html>

<script>
    function GenerateInputFields(name, type, label, format) {
        let options = [];
        
        return {
            In: function(displayLabel, value) {
                options.push({ label: displayLabel, value: value });
                return this;
            },
            Build: function() {
                let html = `<div class="flex">
                    <div class="bg-grey padding-10 margin-1 roudned">
                        <label>${label}</label><br>`;
                
                if (type === "radio" || type === "checkbox") {
                    options.forEach((option, index) => {
                        let checked = index === 0 ? "checked" : "";
                        html += `<input type="${type}" class="${name} form-control" name="${name}" value="${option.value}" ${checked}> 
                                <span>${option.label}</span><br>`;
                    });
                } else {
                    html += `<input type="${type}" class="${name} form-control" name="${name}">`;
                }
                
                html += `</div></div>`;

                let gatherFunction = function() {
                    let inputElements = document.querySelectorAll(`input[name='${name}']`);
                    
                    if (type === "radio") {
                        let selected = document.querySelector(`input[name='${name}']:checked`);
                        return selected && selected.value !== "null" ? format.replace("[VALUE]", selected.value) : "";
                    } else if (type === "checkbox") {
                        let values = Array.from(inputElements)
                            .filter(el => el.checked)
                            .map(el => el.value !== "null" ? el.value : null)
                            .filter(val => val !== null);
                        return values.length > 0 ? format.replace("[VALUE]", values.join(", ")) : "";
                    } else {
                        let inputValue = inputElements[0]?.value || "";
                        return inputValue && inputValue !== "null" ? format.replace("[VALUE]", inputValue) : "";
                    }
                };
                
                return [html, gatherFunction];
            },
        };
    }

    function InsertHTML(targetName, htmlString) {
        let targetElement = document.querySelector(`div[name='${targetName}']`);
        if (targetElement) {
            targetElement.innerHTML += htmlString;
        }
    }

    var [intake_html, intake_func] = GenerateInputFields("intake", "radio", "What's the state of the intake?", "Intake: [VALUE]\n")
        .In("Needs to be Sent", "Needs")
        .In("Sent", "Sent")
        .In("Current", "Current")
        .In("MT Signoff", "MT Signoff")
        .Build();

    InsertHTML("client-form", intake_html);
    
    var [member_type_html, member_type_func] = GenerateInputFields("member_type", "radio", "What type of member are they??", "[VALUE]\n")
        .In("Member", "Mem")
        .In("Non Member", "NM")
        .In("New Client", "NC")
        .In("Associate Member", "Asc Mem")
        .In("Offsite Member", "Off Mem")
        .In("Member", "Mem")
        .In("Terminated", "Term Mem")
        .In("Suspended", "Sus Mem")
        .Build();
    InsertHTML("client-form", member_type_html);

    var [banked_session_html, banked_session_func] = GenerateInputFields("banked_session", "radio", "What type of member are they??", "[VALUE]\n")
        .In("Banked Session", "Banked")
        .In("Member Rate", "89")
        .In("Non Member Rate", "129")
        .In("Gift Card", "GC")
        .In("Elements Promise", "EP")
        .Build();
    InsertHTML("client-form", banked_session_html);

    var [massage_enhancement_html, massage_enhancement_func] = GenerateInputFields("massage_enhancement", "radio", "Did we do an enhancement last time?", "Last Enh: [VALUE]\n")
        .In("No", "null")
        .In("Himilayan Salt Stones", "HSS")
        .In("Cupping", "Cup")
        .In("Aroma Therapy", "Aroma")
        .In("CBD Herbal Ritual", "CBD")
        .Build();
    InsertHTML("massage-form", massage_enhancement_html);
    var [massage_enhancement_promo_html, massage_enhancement_promo_func] = GenerateInputFields("massage_enhancement_promo", "radio", "Do they have an enhancment promo?", "Promo: [VALUE]\n")
        .In("No", "null")
        .In("Birthday Enhancement", "BDAYU")
        .In("Elements Promise", "EP")
        .Build();
    InsertHTML("massage-form", massage_enhancement_promo_html);

    var [skin_condition_html, skin_condition_func] = GenerateInputFields("skin_condition", "text", "Skin Conditions", "Skin Conditions: [VALUE]\n")
        .In("", "")
        .Build();
    InsertHTML("skincare-form", skin_condition_html);

    var [skin_regimen_html, skin_regimen_func] = GenerateInputFields("skin_regimen", "text", "Skin Regimen", "Skin Regimen: [VALUE]\n")
        .In("", "")
        .Build();
    InsertHTML("skincare-form", skin_regimen_html);

    var [confirm_html, confirm_func] = GenerateInputFields("confirm", "radio", "Confirmation?", "Confirmation: [VALUE]\n")
        .In("No", "null")
        .In("Live", "Live")
        .In("Text Message", "TXT")
        .In("Left Voicemail", "LVM")
        .Build();
    InsertHTML("client-form", confirm_html);
    // InsertHTML("skincare-form", occupation_html);

    function OnSubmit(){
        var output = "";

        output += member_type_func();
        output += intake_func();
        output += massage_enhancement_func();
        output += massage_enhancement_promo_func();
        output += banked_session_func();
        output += "\n";
        output += "ST\n";
        output += skin_condition_func();
        output += skin_regimen_func();
        console.log(output);
        
        document.getElementById("output-field").value = output;
    }
    function Clear() {
        location.reload(true);
    }

    // To get the selected value:
    // var confirm_data = confirm_func();

</script>
